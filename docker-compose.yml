# Local development only. Copy docker-compose.env.example to .env and set values.
# Local development uses MySQL 8. Production uses render.yaml with ENVIRONMENT=production
# and either managed PostgreSQL TLS or externally hosted MySQL TLS. PostgreSQL is run
# locally outside compose against the dedicated stockiq_pg_test database for integration tests.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: stockiq
      MYSQL_USER: stockiq
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
  api:
    build: ./backend
    depends_on:
      db: {condition: service_healthy}
    environment:
      ENVIRONMENT: development
      DATABASE_URL: mysql+pymysql://stockiq:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:3306/stockiq
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      STAFF_PASSWORD: ${STAFF_PASSWORD:?set STAFF_PASSWORD in .env}
    ports: ["8000:8000"]
volumes:
  dbdata:
