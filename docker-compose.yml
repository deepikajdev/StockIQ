services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: stockiq
      MYSQL_USER: stockiq
      MYSQL_PASSWORD: ${DB_PASSWORD:-stockiq}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
  api:
    build: ./backend
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: mysql+pymysql://stockiq:${DB_PASSWORD:-stockiq}@db:3306/stockiq
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-staff12345}
    ports: ["8000:8000"]
volumes:
  dbdata:
