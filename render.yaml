# Render blueprint (backend). MySQL is not offered by Render managed DBs — use a hosted MySQL
# (Aiven free tier, PlanetScale, Railway MySQL, TiDB Serverless) and paste its URL as DATABASE_URL.
services:
  - type: web
    name: stockiq-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STAFF_PASSWORD
        sync: false
