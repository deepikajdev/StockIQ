name: Database compatibility

on:
  push:
    branches: [migration/postgresql]
  pull_request:

jobs:
  mysql:
    name: MySQL 8 compatibility
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: stockiq_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Run MySQL compatibility tests
        env:
          ENVIRONMENT: development
          DATABASE_URL: mysql+pymysql://root@127.0.0.1:3306/stockiq_test
          STOCKIQ_TEST_DB: stockiq_test
        run: |
          python -m scripts.bootstrap
          python -m pytest \
            tests/test_dialect_compatibility.py \
            tests/test_orm_metadata.py \
            tests/test_health.py \
            tests/test_stock_workflows.py \
            tests/test_purchase_rbac.py \
            -q

  postgresql:
    name: PostgreSQL 14 compatibility
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: stockiq_pg_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d stockiq_pg_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Run PostgreSQL compatibility tests
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/stockiq_pg_test
          STOCKIQ_TEST_DB: stockiq_pg_test
        run: |
          python -m scripts.bootstrap
          python -m pytest \
            tests/test_dialect_compatibility.py \
            tests/test_orm_metadata.py \
            tests/test_postgresql_config.py \
            tests/test_postgresql_object_installation.py \
            tests/test_postgresql_integration.py \
            tests/test_purchase_rbac.py \
            -q
